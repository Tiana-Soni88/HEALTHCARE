<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · MediCare ERP</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    /* ============================================================
       MASTER STYLE BLOCK
       Copy this entire <style> block into every HTML page.
       ============================================================ */

    /* ---------- RESET & TOKENS ---------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --grad-brand: linear-gradient(135deg, #0ea5e9 0%, #0f172a 100%);
      --grad-sidebar: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      --grad-btn: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      --grad-btn-hover: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      --grad-danger: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      --grad-success: linear-gradient(135deg, #10b981 0%, #047857 100%);

      --c-bg: #f1f5f9;
      --c-surface: #ffffff;
      --c-border: #e2e8f0;
      --c-border-strong: #cbd5e1;
      --c-text: #0f172a;
      --c-text-muted: #64748b;
      --c-text-soft: #94a3b8;
      --c-primary: #0284c7;
      --c-primary-dark: #0f172a;
      --c-accent: #0ea5e9;
      --c-danger: #ef4444;
      --c-success: #10b981;
      --c-warning: #f59e0b;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12);

      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 14px;

      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "SF Mono", Monaco, Consolas, "Courier New", monospace;
    }

    html, body {
      font-family: var(--font);
      color: var(--c-text);
      background: var(--c-bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }

    /* ---------- LOGIN ---------- */
    .login-body {
      min-height: 100vh;
      background: var(--grad-brand);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .login-body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.07) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.05) 0%, transparent 40%);
      pointer-events: none;
    }
    .login-card {
      background: var(--c-surface);
      padding: 44px 40px;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 420px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
      position: relative;
      z-index: 1;
      animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-card .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .login-card .brand-mark {
      width: 56px; height: 56px;
      border-radius: 14px;
      background: var(--grad-brand);
      display: grid;
      place-items: center;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.3);
    }
    .login-card .brand-mark svg { width: 30px; height: 30px; }
    .login-card h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--c-primary-dark);
      letter-spacing: -0.02em;
    }
    .login-card .subtitle {
      color: var(--c-text-muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 5px;
      font-weight: 600;
    }
    .form-field { margin-bottom: 18px; }
    .form-field label {
      display: block;
      margin-bottom: 7px;
      color: var(--c-text);
      font-weight: 500;
      font-size: 13px;
    }
    .form-field input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--c-border);
      border-radius: var(--radius);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      background: #f8fafc;
    }
    .form-field input:focus {
      border-color: var(--c-accent);
      background: white;
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
    }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 46px; }
    .toggle-password {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      padding: 8px;
      color: var(--c-text-soft);
      border-radius: var(--radius-sm);
      display: flex;
      line-height: 0;
      transition: color 0.15s, background 0.15s;
    }
    .toggle-password:hover { color: var(--c-primary); background: #f1f5f9; }
    .toggle-password svg { display: block; pointer-events: none; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.1s, box-shadow 0.15s, background 0.15s;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--grad-btn);
      color: white;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--grad-btn-hover);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
    }
    .btn-primary:active:not(:disabled) { transform: translateY(1px); }
    .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }
    .btn-block { width: 100%; padding: 13px; font-size: 15px; }

    .form-error {
      color: var(--c-danger);
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
      min-height: 18px;
      font-weight: 500;
    }
    .login-foot {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--c-border);
      text-align: center;
      color: var(--c-text-soft);
      font-size: 12px;
    }
  </style>
</head>
<body class="login-body">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="white"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></svg>
      </div>
      <h1>MediCare</h1>
      <p class="subtitle">Hospital ERP System</p>
    </div>

    <form id="loginForm">
      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@hospital.com" required autocomplete="username">
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Sign In</button>
      <p id="errorMsg" class="form-error"></p>
    </form>

    <div class="login-foot">
      Authorised personnel only · Confidential medical environment
    </div>
  </div>

  <script type="module" src="core.js"></script>
</body>
</html>
