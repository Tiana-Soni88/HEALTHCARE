<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients - MediCare</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <h2>🏥 MediCare</h2>
      <nav>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="patients.html" class="active">👤 Patients</a>
        <a href="appointments.html">📅 Appointments</a>
        <a href="staff.html">👨‍⚕️ Staff</a>
        <a href="records.html">📁 Records</a>
        <a href="beds.html">🛏️ Beds</a>
      </nav>
      <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Patients</h1>
        <button id="addBtn" class="primary-btn">+ Add Patient</button>
      </header>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th><th>Age</th><th>Gender</th>
              <th>Diagnosis</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Add Patient</h2>
      <form id="dataForm">
        <input type="hidden" id="recordId">
        <input type="text" id="fName" placeholder="Full Name" required>
        <input type="number" id="fAge" placeholder="Age" required min="0" max="130">
        <select id="fGender" required>
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
        <input type="text" id="fDiagnosis" placeholder="Diagnosis">
        <div class="modal-actions">
          <button type="button" class="secondary-btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
  <script type="module" src="patients.js"></script>
</body>
</html>
