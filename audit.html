<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Log · MediCare ERP</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    /* ============================================================
       STYLE BLOCK 1 of 2 — MASTER (same on every page)
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --grad-brand: linear-gradient(135deg, #0ea5e9 0%, #0f172a 100%);
      --grad-sidebar: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      --grad-btn: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      --grad-btn-hover: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      --grad-danger: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      --grad-success: linear-gradient(135deg, #10b981 0%, #047857 100%);
      --c-bg: #f1f5f9;
      --c-surface: #ffffff;
      --c-border: #e2e8f0;
      --c-border-strong: #cbd5e1;
      --c-text: #0f172a;
      --c-text-muted: #64748b;
      --c-text-soft: #94a3b8;
      --c-primary: #0284c7;
      --c-primary-dark: #0f172a;
      --c-accent: #0ea5e9;
      --c-danger: #ef4444;
      --c-success: #10b981;
      --c-warning: #f59e0b;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12);
      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 14px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "SF Mono", Monaco, Consolas, "Courier New", monospace;
    }

    html, body {
      font-family: var(--font);
      color: var(--c-text);
      background: var(--c-bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.1s, box-shadow 0.15s, background 0.15s;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--grad-btn);
      color: white;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--grad-btn-hover);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
    }
    .btn-secondary {
      background: white;
      color: var(--c-primary-dark);
      border: 1.5px solid var(--c-border-strong);
    }
    .btn-secondary:hover { background: #f8fafc; border-color: var(--c-primary); }
    .btn-danger {
      background: var(--grad-danger);
      color: white;
    }
    .btn-danger:hover { filter: brightness(0.95); }
    .btn-success {
      background: var(--grad-success);
      color: white;
    }
    .btn-sm { padding: 7px 12px; font-size: 13px; }
    .btn svg { width: 16px; height: 16px; }

    /* ============================================================
       STYLE BLOCK 2 of 2 — APP SHELL + TOOLBAR + TABLE + MODAL
       ============================================================ */
    .app { display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: var(--grad-sidebar);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
      border-right: 1px solid rgba(255,255,255,0.04);
      z-index: 50;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 22px 22px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-brand svg { width: 34px; height: 34px; flex-shrink: 0; }
    .sidebar-brand .name { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; color: white; }
    .sidebar-brand .sub { font-size: 10.5px; color: #94a3b8; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; font-weight: 600; }

    .sidebar-nav {
      flex: 1;
      padding: 14px 12px;
      overflow-y: auto;
    }
    .sidebar-nav::-webkit-scrollbar { width: 6px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    .nav-section-title {
      font-size: 10.5px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 14px 12px 6px;
      font-weight: 700;
    }
    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      color: #cbd5e1;
      font-size: 13.5px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
      margin-bottom: 2px;
    }
    .sidebar-nav a svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.7; }
    .sidebar-nav a:hover { background: rgba(255,255,255,0.05); color: white; }
    .sidebar-nav a:hover svg { opacity: 1; }
    .sidebar-nav a.active {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.2) 0%, rgba(2, 132, 199, 0.08) 100%);
      color: white;
      box-shadow: inset 3px 0 0 var(--c-accent);
    }
    .sidebar-nav a.active svg { opacity: 1; color: var(--c-accent); }

    .sidebar-foot {
      padding: 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.04);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
    }
    .user-pill .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--grad-btn);
      display: grid; place-items: center;
      font-weight: 700;
      font-size: 13px;
      color: white;
      flex-shrink: 0;
    }
    .user-pill .info { overflow: hidden; min-width: 0; }
    .user-pill .info .label { font-size: 10.5px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
    .user-pill .info .email {
      font-size: 12px;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .logout-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fecaca;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .logout-btn:hover { background: rgba(239, 68, 68, 0.12); border-color: var(--c-danger); color: white; }
    .logout-btn svg { width: 15px; height: 15px; }

    /* MAIN */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      background: white;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--c-border);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .topbar h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--c-primary-dark);
      letter-spacing: -0.02em;
    }
    .topbar .subtitle { font-size: 13px; color: var(--c-text-muted); margin-top: 2px; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .live-clock {
      font-size: 13px;
      color: var(--c-text-muted);
      font-variant-numeric: tabular-nums;
      padding: 7px 13px;
      background: #f8fafc;
      border: 1px solid var(--c-border);
      border-radius: 20px;
      font-weight: 500;
    }
    .content { padding: 28px 32px 40px; }

    /* TOOLBAR (search + filter + sync) */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
      max-width: 420px;
    }
    .search-box input {
      width: 100%;
      padding: 11px 40px 11px 42px;
      border: 1.5px solid var(--c-border);
      border-radius: var(--radius);
      font-size: 14px;
      outline: none;
      background: white;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-box input:focus {
      border-color: var(--c-accent);
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
    }
    .search-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--c-text-soft);
      pointer-events: none;
      display: flex;
    }
    .clear-btn {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      width: 26px; height: 26px;
      border-radius: 50%;
      display: none;
      place-items: center;
      color: var(--c-text-muted);
      transition: background 0.15s;
    }
    .search-box.has-value .clear-btn { display: grid; }
    .clear-btn:hover { background: #f1f5f9; }
    .clear-btn svg { width: 13px; height: 13px; }

    .filter-select {
      padding: 11px 14px;
      border: 1.5px solid var(--c-border);
      border-radius: var(--radius);
      font-size: 14px;
      background: white;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .filter-select:focus {
      border-color: var(--c-accent);
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--c-success);
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      padding: 7px 12px;
      border-radius: 20px;
    }
    .sync-badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--c-success);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .result-count {
      font-size: 13px;
      color: var(--c-text-muted);
      margin-bottom: 12px;
    }
    .result-count strong { color: var(--c-primary-dark); font-weight: 600; }

    /* TABLE */
    .table-wrap {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--c-border);
      overflow: hidden;
    }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td {
      padding: 13px 20px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid var(--c-border);
    }
    .data-table th {
      background: #f8fafc;
      font-weight: 600;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--c-text-muted);
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tbody tr { transition: background 0.1s; }
    .data-table tbody tr:hover { background: #f8fafc; }
    .data-table td.actions { text-align: right; white-space: nowrap; }
    mark {
      background: #fef3c7;
      color: #92400e;
      padding: 1px 3px;
      border-radius: 3px;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px !important;
      color: var(--c-text-soft);
      font-size: 14px;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      display: inline-grid;
      place-items: center;
      background: transparent;
      color: var(--c-text-muted);
      transition: background 0.15s, color 0.15s;
    }
    .btn-icon:hover { background: #f1f5f9; color: var(--c-primary-dark); }
    .btn-icon.edit:hover { color: var(--c-primary); background: #e0f2fe; }
    .btn-icon.delete:hover { color: var(--c-danger); background: #fee2e2; }
    .btn-icon svg { width: 15px; height: 15px; }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      border-radius: var(--radius-lg);
      padding: 28px 30px;
      width: 100%;
      max-width: 460px;
      box-shadow: var(--shadow-lg);
      animation: rise 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 90vh;
      overflow-y: auto;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-content h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--c-primary-dark);
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }
    .modal-content label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--c-text);
    }
    .modal-content input,
    .modal-content select,
    .modal-content textarea {
      width: 100%;
      padding: 11px 14px;
      margin-bottom: 14px;
      border: 1.5px solid var(--c-border);
      border-radius: var(--radius);
      font-size: 14px;
      outline: none;
      background: #f8fafc;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      font-family: inherit;
      resize: vertical;
    }
    .modal-content input:focus,
    .modal-content select:focus,
    .modal-content textarea:focus {
      border-color: var(--c-accent);
      background: white;
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    /* TOAST */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 9999;
    }
    .toast {
      background: white;
      color: var(--c-primary-dark);
      padding: 14px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border-left: 4px solid var(--c-primary);
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transform: translateX(20px);
      transition: opacity 0.25s, transform 0.25s;
      min-width: 240px;
      max-width: 340px;
    }
    .toast.show { opacity: 1; transform: translateX(0); }
    .toast-success { border-left-color: var(--c-success); }
    .toast-error { border-left-color: var(--c-danger); }
    .toast-info { border-left-color: var(--c-primary); }

    /* ============================================================
       PHASE 1 — GLOBAL SEARCH + PRINT CSS
       ============================================================ */
    .global-search-wrap {
      position: relative;
      width: 320px;
      flex-shrink: 1;
    }
    .global-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--c-text-soft);
      pointer-events: none;
      display: flex;
    }
    .global-search-wrap input {
      width: 100%;
      padding: 9px 14px 9px 38px;
      border: 1.5px solid var(--c-border);
      border-radius: 20px;
      font-size: 13.5px;
      outline: none;
      background: #f8fafc;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .global-search-wrap input:focus {
      border-color: var(--c-accent);
      background: white;
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
    }
    .global-search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--c-border);
      max-height: 420px;
      overflow-y: auto;
      z-index: 200;
      display: none;
    }
    .global-search-results.active { display: block; }
    .global-search-loading,
    .global-search-empty {
      padding: 16px 18px;
      color: var(--c-text-muted);
      font-size: 13px;
      text-align: center;
    }
    .global-result {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--c-border);
      transition: background 0.1s;
    }
    .global-result:last-child { border-bottom: none; }
    .global-result:hover { background: #f8fafc; }
    .global-result-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: var(--grad-btn);
      color: white;
      display: grid; place-items: center;
      font-weight: 700; font-size: 12px;
      flex-shrink: 0;
    }
    .global-result-info { min-width: 0; flex: 1; }
    .global-result-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--c-primary-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .global-result-meta {
      font-size: 11.5px;
      color: var(--c-text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* MOBILE */
    .menu-toggle { display: none; }
    @media (max-width: 900px) {
      .sidebar {
        position: fixed;
        left: 0; top: 0;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        z-index: 100;
        box-shadow: 20px 0 60px rgba(0,0,0,0.3);
      }
      .sidebar.open { transform: translateX(0); }
      .menu-toggle {
        display: inline-grid;
        place-items: center;
        width: 40px; height: 40px;
        border: 1.5px solid var(--c-border);
        border-radius: var(--radius-sm);
        background: white;
        margin-right: 12px;
      }
      .menu-toggle svg { width: 20px; height: 20px; }
      .topbar { padding: 14px 18px; }
      .topbar h1 { font-size: 18px; }
      .content { padding: 18px 16px 40px; }
      .live-clock { display: none; }
      .data-table th, .data-table td { padding: 10px 12px; font-size: 13px; }
      .global-search-wrap { width: 100%; margin-bottom: 8px; }
      .topbar-right { flex-wrap: wrap; }
    }

    /* PRINT */
    @media print {
      .sidebar, .topbar, .toolbar, .result-count, .modal, .toast-container,
      .actions, .btn, button, .sync-badge, .global-search-wrap,
      .menu-toggle, .live-clock {
        display: none !important;
      }
      .app { display: block; }
      .content { padding: 0; }
      .main { width: 100%; }
      .table-wrap, .ward-card, .panel {
        box-shadow: none !important;
        border: 1px solid #ccc;
      }
      .data-table th, .data-table td {
        padding: 8px 10px !important;
        font-size: 12px !important;
      }
      .data-table th {
        background: #f1f1f1 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body { background: white !important; }
      @page { margin: 1cm; }
    }
  </style>
</head>
<body class="app" data-page="audit">
  <!-- ==================== SIDEBAR ==================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <svg viewBox="0 0 64 64">
        <defs>
          <linearGradient id="sb" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0ea5e9"/>
            <stop offset="100%" stop-color="#0f172a"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="14" fill="url(#sb)"/>
        <path d="M27 12h10v12h12v10H37v18H27V34H15V24h12z" fill="#ffffff"/>
      </svg>
      <div>
        <div class="name">MediCare</div>
        <div class="sub">Hospital ERP</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">Overview</div>
      <a href="dashboard.html" data-nav="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Dashboard
      </a>

      <div class="nav-section-title">Clinical</div>
      <a href="patients.html" data-nav="patients" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>
        Patients
