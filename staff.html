<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff - MediCare</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <h2>🏥 MediCare</h2>
      <nav>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="patients.html">👤 Patients</a>
        <a href="appointments.html">📅 Appointments</a>
        <a href="staff.html" class="active">👨‍⚕️ Staff</a>
        <a href="records.html">📁 Records</a>
        <a href="beds.html">🛏️ Beds</a>
      </nav>
      <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Staff</h1>
        <button id="addBtn" class="primary-btn">+ Add Staff</button>
      </header>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
              <th>Department</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Add Staff</h2>
      <form id="dataForm">
        <input type="hidden" id="recordId">
        <input type="text" id="fName" placeholder="Full Name" required>
        <select id="fRole" required>
          <option value="">Select Role</option>
          <option>Doctor</option>
          <option>Nurse</option>
          <option>Admin</option>
          <option>Technician</option>
          <option>Receptionist</option>
        </select>
        <input type="text" id="fDepartment" placeholder="Department" required>
        <input type="email" id="fEmail" placeholder="Email" required>
        <input type="tel" id="fPhone" placeholder="Phone">
        <div class="modal-actions">
          <button type="button" class="secondary-btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
  <script type="module" src="staff.js"></script>
</body>
</html>
