<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - MediCare</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <h2>🏥 MediCare</h2>
      <nav>
        <a href="dashboard.html" class="active">📊 Dashboard</a>
        <a href="patients.html">👤 Patients</a>
        <a href="appointments.html">📅 Appointments</a>
        <a href="staff.html">👨‍⚕️ Staff</a>
        <a href="records.html">📁 Records</a>
        <a href="beds.html">🛏️ Beds</a>
      </nav>
      <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Dashboard</h1>
        <span id="userEmail" class="user-badge"></span>
      </header>

      <section class="stats-grid">
  <div class="stat-card"><h3>Total Patients</h3><p id="totalPatients">0</p></div>
  <div class="stat-card"><h3>Appointments</h3><p id="totalAppts">0</p></div>
  <div class="stat-card"><h3>Staff On Duty</h3><p id="totalStaff">0</p></div>
  <div class="stat-card"><h3>Records</h3><p id="totalRecords">0</p></div>
  <div class="stat-card"><h3>Beds Occupied</h3><p id="bedsOccupied">0</p></div>
  <div class="stat-card"><h3>Beds Available</h3><p id="bedsAvailable">0</p></div>
</section>
    </main>
  </div>

  <script type="module" src="auth.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
